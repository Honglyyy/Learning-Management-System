
server.port=8080

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# MULTIPART / FILE UPLOAD
# ===============================
# Spring native properties for file uploads
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# Custom file upload properties
lms.upload-dir=uploads
lms.upload.max-image-size=5242880
lms.upload.max-video-size=524288000

# ===============================
# MAIL CONFIGURATION
# ===============================
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.from=honglylay14@gmail.com

# ===============================
# JWT CONFIGURATION
# ===============================
# Key should be at least 256 bits (32 bytes) for HS256 algorithm
jwt.secret.key=${JWT_SECRET_KEY}

# ===============================
# CLOUDINARY CONFIGURATION
# ===============================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# ===============================
# ACTUATOR & HEALTH MONITORING
# ===============================
# Expose only the health check endpoint
management.endpoints.web.exposure.include=health

# Show only status ("UP" / "DOWN") without internal component details
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

# Prevent offline/unconfigured external SMTP from reporting DOWN
management.health.mail.enabled=false

